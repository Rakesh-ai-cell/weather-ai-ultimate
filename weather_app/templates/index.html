<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Weather Ultimate</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #121212; color: white; text-align: center; margin: 0; }
        .container { max-width: 800px; margin: auto; padding: 20px; }
        input { padding: 12px; border-radius: 20px; border: none; width: 60%; }
        button { padding: 12px 25px; border-radius: 20px; border: none; background: #007bff; color: white; cursor: pointer; }
        .weather-card { background: #1e1e1e; padding: 30px; border-radius: 20px; margin-top: 20px; }
        .forecast-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 10px; margin-top: 20px; }
        .day-card { background: #2a2a2a; padding: 15px; border-radius: 15px; }
        .ai-box { background: #333; padding: 15px; border-left: 5px solid #007bff; margin: 20px 0; font-style: italic; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Weather AI Ultimate</h1>
        <form method="POST"> {% csrf_token %}
            <input type="text" name="city" placeholder="Enter city name..." required>
            <button type="submit">Search</button>
        </form>

        {% if weather %}
        <div class="weather-card">
            <h2>{{ weather.city }}</h2>
            <img src="http://openweathermap.org/img/wn/{{ weather.icon }}@2x.png">
            <h1>{{ weather.temp }}°C</h1>
            <p>{{ weather.desc|title }}</p>

            <div class="ai-box">
                <p><strong>AI Tip:</strong> {{ weather.ai_insight }}</p>
            </div>

            {% if weather.audio_data %}
            <audio id="weatherAudio" autoplay>
                <source src="data:audio/mp3;base64,{{ weather.audio_data }}" type="audio/mp3">
            </audio>
            {% endif %}
        </div>

        <div class="forecast-grid">
            {% for day in forecast %}
            <div class="day-card">
                <strong>{{ day.day }}</strong><br>
                <img src="http://openweathermap.org/img/wn/{{ day.icon }}.png"><br>
                {{ day.temp }}°C
            </div>
            {% endfor %}
        </div>
        {% endif %}
    </div>
</body>
</html>
